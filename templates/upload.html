<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Pesa Reconciliation</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-lg shadow-md w-full max-w-md p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">M-Pesa Reconciliation</h1>
    <p class="text-sm text-gray-500 mb-6">Upload your statement and sales record to check for discrepancies.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-4">
          {% for m in messages %}
            <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-md px-3 py-2 mb-2">
              {{ m }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          M-Pesa Statement (.xlsx or .csv)
        </label>
        <input type="file" name="statement" required
          class="block w-full text-sm text-gray-600
                 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0
                 file:bg-green-50 file:text-green-700 file:font-medium
                 hover:file:bg-green-100 border border-gray-300 rounded-md">
      </div>

      
      <div>
  <label class="block text-sm font-medium text-gray-700 mb-1">
    Sales Record (.csv or .xlsx)
  </label>
  <input type="file" name="sales" accept=".csv,.xlsx" required
    class="block w-full text-sm text-gray-600
           file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0
           file:bg-green-50 file:text-green-700 file:font-medium
           hover:file:bg-green-100 border border-gray-300 rounded-md">
</div>
    

      <button type="submit"
        class="w-full bg-green-600 hover:bg-green-700 text-white font-medium
               py-2.5 rounded-md transition-colors">
        Reconcile
      </button>
    </form>
  </div>

</body>
</html>
